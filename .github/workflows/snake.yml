name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the SVG snake
        uses: Platane/snk@v3
        with:
          github_user_name: khanhishan70-stack
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=22D3EE&color_dots=0f172a,1e293b,3B82F6,8B5CF6,10B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=22D3EE&color_dots=0f172a,1e293b,3B82F6,8B5CF6,10B981&color_dots=0f172a,1e293b,3B82F6,8B5CF6,10B981

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
