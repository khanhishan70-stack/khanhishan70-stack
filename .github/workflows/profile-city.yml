name: Generate 3D contribution city

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate profile-3d-contrib.svg
        uses: yoshi389111/github-profile-3d-contrib@master
        with:
          USERNAME: ${{ github.repository_owner }}
          PAT: ${{ secrets.PAT }}
          OUTPUT: profile-3d-contrib.svg
          THEME: night

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain profile-3d-contrib.svg)" ]; then
            echo "No change in the city, skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib.svg
          git commit -m "chore: refresh 3D contribution city"
          git push
