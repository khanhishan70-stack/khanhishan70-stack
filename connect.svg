<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Let's connect">
  <title>Connect</title>
  <defs>
    <linearGradient id="cnSurf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141f"/><stop offset="1" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="cnHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cnNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="cnAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cnDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="cnCard"><rect x="0" y="0" width="1200" height="420" rx="26"/></clipPath>
    <clipPath id="cnCharClip"><rect x="30" y="30" width="380" height="360" rx="22"/></clipPath>
    <filter id="cnGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cnNeonBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .cn-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .cn-sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cn-in { animation: cnIn .8s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; }
    .c1{animation-delay:.05s}.c2{animation-delay:.13s}.c3{animation-delay:.21s}
    .c4{animation-delay:.29s}.c5{animation-delay:.37s}.c6{animation-delay:.45s}
    .c7{animation-delay:.53s}.c8{animation-delay:.61s}.c9{animation-delay:.69s}
    .c10{animation-delay:.77s}.c11{animation-delay:.85s}.c12{animation-delay:.93s}
    @keyframes cnIn { from { opacity:0; transform: translateY(20px) } to { opacity:1; transform: none } }
    .cn-nudge-1 { animation: cnNudge1 2.6s ease-in-out infinite; }
    .cn-nudge-2 { animation: cnNudge2 2.6s ease-in-out infinite .4s; }
    .cn-nudge-3 { animation: cnNudge3 2.6s ease-in-out infinite .8s; }
    @keyframes cnNudge1 { 0%,70%,100%{transform:translateX(0)} 82%{transform:translateX(7px)} }
    @keyframes cnNudge2 { 0%,70%,100%{transform:translateX(0)} 82%{transform:translateX(7px)} }
    @keyframes cnNudge3 { 0%,70%,100%{transform:translateX(0)} 82%{transform:translateX(7px)} }
    .cn-neon { animation: cnNeon 3.2s ease-in-out infinite; }
    @keyframes cnNeon {
      0%,100% { opacity:.85 }
      50%     { opacity:1; filter:drop-shadow(0 0 6px rgba(167,139,250,.9)) }
    }
    .cn-spark { animation: cnSpark 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cnSpark { 0%,100%{opacity:.2;transform:scale(.7)} 50%{opacity:1;transform:scale(1.15)} }
    .cn-char { animation: cnChar 4s ease-in-out infinite; transform-box: view-box; transform-origin: 220px 215px; }
    @keyframes cnChar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .cn-tilt { animation: cnTilt 6s ease-in-out infinite; transform-box: view-box; transform-origin: 220px 200px; }
    @keyframes cnTilt { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-1.6deg)} }
  </style>

  <g clip-path="url(#cnCard)">
    <rect width="1200" height="420" fill="url(#cnSurf)"/>
    <rect width="1200" height="420" fill="url(#cnDots)"/>
    <ellipse cx="200" cy="200" rx="340" ry="280" fill="url(#cnAura)" opacity="0.7"/>
    <ellipse cx="1000" cy="380" rx="320" ry="240" fill="url(#cnAura)" opacity="0.4"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="26" fill="none" stroke="url(#cnHair)" stroke-width="1.5"/>

    <!-- ===== LEFT : character ===== -->
    <g clip-path="url(#cnCharClip)">
      <rect x="30" y="30" width="380" height="360" rx="22" fill="#ffffff" fill-opacity="0.035"/>
      <rect x="30.5" y="30.5" width="379" height="359" rx="22" fill="none" stroke="url(#cnHair)" stroke-opacity="0.28"/>

      <!-- radial glow behind character -->
      <circle cx="220" cy="215" r="120" fill="url(#cnNeon)" opacity="0.10"/>
      <circle cx="220" cy="215" r="120" fill="none" stroke="url(#cnNeon)" stroke-opacity="0.22" stroke-dasharray="4 10"/>

      <!-- character (built from shapes, pointing right) -->
      <g class="cn-char">
        <g class="cn-tilt" transform="translate(70,26)">
          <!-- legs -->
          <path d="M104 236h30l-4 78a12 12 0 0 1-12 11h-2a11 11 0 0 1-11-12z" fill="#1d2130" stroke="url(#cnHair)" stroke-opacity="0.45" stroke-width="1.5"/>
          <path d="M146 236h30l6 77a11 11 0 0 1-10 12h-2a12 12 0 0 1-12-11z" fill="#1d2130" stroke="url(#cnHair)" stroke-opacity="0.45" stroke-width="1.5"/>
          <!-- shoes -->
          <rect x="98" y="316" width="40" height="18" rx="8" fill="#0d0e16" stroke="url(#cnHair)" stroke-opacity="0.5" stroke-width="1.5"/>
          <rect x="152" y="316" width="42" height="18" rx="8" fill="#0d0e16" stroke="url(#cnHair)" stroke-opacity="0.5" stroke-width="1.5"/>
          <!-- hoodie body -->
          <path d="M92 132c0-16 13-28 30-28h22c17 0 30 12 30 28v108H92z" fill="#f4f7ff" stroke="url(#cnHair)" stroke-opacity="0.5" stroke-width="1.6"/>
          <!-- tee underneath -->
          <path d="M118 106h32v22a16 16 0 0 1-32 0z" fill="#fbbf24" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.4"/>
          <!-- hood behind head -->
          <path d="M110 108c0-14 12-24 26-24h14c14 0 26 10 26 24-8-8-16-10-26-10h-14c-10 0-18 2-26 10z" fill="#e2e8f5" stroke="#94a3b8" stroke-opacity="0.7" stroke-width="1.4"/>
          <!-- head -->
          <circle cx="138" cy="72" r="30" fill="#ffe0c2" stroke="#e8b892" stroke-width="1.4"/>
          <!-- hair -->
          <path d="M108 70c0-20 13-32 30-32s30 12 30 32c-6-10-16-14-30-14s-24 4-30 14z" fill="#2b2a35"/>
          <path d="M108 70c-4 14 0 26 4 32-8-2-12-10-12-20 0-6 3-10 8-12z" fill="#2b2a35"/>
          <!-- sunglasses on head -->
          <path d="M118 44h40" stroke="#a78bfa" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
          <circle cx="122" cy="44" r="5" fill="none" stroke="#a78bfa" stroke-width="2.4" opacity="0.9"/>
          <circle cx="154" cy="44" r="5" fill="none" stroke="#a78bfa" stroke-width="2.4" opacity="0.9"/>
          <!-- wink + smile -->
          <path d="M124 74q6-6 12 0" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M146 72q6 4 10-2" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M130 86q9 8 18 0" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
          <!-- pointing arm to the right -->
          <path d="M170 150c18 2 30 6 38 12" fill="none" stroke="#f4f7ff" stroke-width="20" stroke-linecap="round"/>
          <path d="M170 150c18 2 30 6 38 12" fill="none" stroke="url(#cnHair)" stroke-opacity="0.5" stroke-width="1.5"/>
          <!-- hand -->
          <circle cx="210" cy="163" r="11" fill="#ffe0c2" stroke="#e8b892" stroke-width="1.4"/>
          <path d="M218 158l22-10" stroke="#ffe0c2" stroke-width="9" stroke-linecap="round"/>
          <path d="M218 158l22-10" stroke="#e8b892" stroke-width="1.2" fill="none"/>
          <!-- left arm holding laptop -->
          <path d="M100 158c-14 6-20 18-18 32" fill="none" stroke="#f4f7ff" stroke-width="18" stroke-linecap="round"/>
          <!-- laptop -->
          <path d="M56 196l72-6 8 44-76 4z" fill="#1d2130" stroke="url(#cnHair)" stroke-opacity="0.6" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M62 202l60-5 5 32-62 4z" fill="#22d3ee" fill-opacity="0.18"/>
          <path d="M70 212h34M70 220h24M70 228h40" stroke="#a5f3fc" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
          <!-- neon handle sign -->
          <g class="cn-neon" filter="url(#cnNeonBlur)">
            <text x="268" y="72" class="cn-mono" font-size="26" font-weight="700" fill="url(#cnNeon)" letter-spacing="0.5">@khanhishan70</text>
          </g>
          <text x="268" y="72" class="cn-mono" font-size="26" font-weight="700" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="0.8" letter-spacing="0.5">@khanhishan70</text>
        </g>
      </g>

      <!-- sparkles + hearts -->
      <g fill="#fbbf24">
        <path class="cn-spark" d="M344 92l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="transform-origin:344px 103px"/>
        <path class="cn-spark" d="M366 140l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z" style="transform-origin:366px 150px;animation-delay:.6s"/>
        <path class="cn-spark" d="M332 168l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" style="transform-origin:332px 176px;animation-delay:1.1s"/>
      </g>
      <g fill="#f472b6">
        <path class="cn-spark" d="M356 200c-5-5-13-1-13 5 0 6 8 11 13 15 5-4 13-9 13-15 0-6-8-10-13-5z" style="transform-origin:356px 210px;animation-delay:.3s"/>
        <path class="cn-spark" d="M338 240c-3.4-3.4-9-0.7-9 3.4 0 4 5.4 7.6 9 10.4 3.6-2.8 9-6.4 9-10.4 0-4.1-5.6-6.8-9-3.4z" style="transform-origin:338px 250px;animation-delay:.9s"/>
      </g>
    </g>

    <!-- ===== RIGHT : link cards ===== -->
    <g class="cn-in c5">
      <text x="450" y="76" class="cn-sans" font-size="34" font-weight="800" fill="#eef2ff" letter-spacing="-0.6">Let&#39;s build something</text>
      <rect x="450" y="90" width="112" height="4" rx="2" fill="url(#cnHair)"/>
      <text x="450" y="122" class="cn-mono" font-size="14" fill="#8b93b0">DMs are open · Mumbai · open to internships &amp; collabs</text>
    </g>

    <!-- card 1 : GitHub -->
    <g class="cn-in c6">
      <rect x="450" y="146" width="330" height="72" rx="18" fill="#ffffff" fill-opacity="0.045" stroke="url(#cnHair)" stroke-opacity="0.28"/>
      <rect x="450" y="146" width="5" height="72" rx="2.5" fill="#22d3ee"/>
      <g transform="translate(474,166)">
        <circle cx="17" cy="17" r="16" fill="none" stroke="#e6edf3" stroke-width="1.6"/>
        <path d="M17 8v9l6 3" fill="none" stroke="#e6edf3" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9 24c6-2 10-7 10-13" fill="none" stroke="#e6edf3" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="524" y="180" class="cn-sans" font-size="18" font-weight="600" fill="#eef2ff">GitHub</text>
      <text x="524" y="202" class="cn-mono" font-size="12.5" fill="#8b93b0">@khanhishan70-stack</text>
      <g class="cn-nudge-1">
        <path d="M740 176h16m-6-6l6 6-6 6" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- card 2 : Email -->
    <g class="cn-in c7">
      <rect x="800" y="146" width="360" height="72" rx="18" fill="#ffffff" fill-opacity="0.045" stroke="url(#cnHair)" stroke-opacity="0.28"/>
      <rect x="800" y="146" width="5" height="72" rx="2.5" fill="#a78bfa"/>
      <g transform="translate(824,166)">
        <rect x="0" y="4" width="34" height="26" rx="5" fill="none" stroke="#c4b5fd" stroke-width="1.8"/>
        <path d="M2 7l15 11L32 7" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="874" y="180" class="cn-sans" font-size="18" font-weight="600" fill="#eef2ff">Email</text>
      <text x="874" y="202" class="cn-mono" font-size="12.5" fill="#8b93b0">khanhishan70@gmail.com</text>
      <g class="cn-nudge-2">
        <path d="M1120 176h16m-6-6l6 6-6 6" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- card 3 : LinkedIn -->
    <g class="cn-in c8">
      <rect x="450" y="234" width="330" height="72" rx="18" fill="#ffffff" fill-opacity="0.045" stroke="url(#cnHair)" stroke-opacity="0.28"/>
      <rect x="450" y="234" width="5" height="72" rx="2.5" fill="#38bdf8"/>
      <g transform="translate(474,254)">
        <rect x="0" y="0" width="34" height="34" rx="6" fill="#0a66c2" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.6"/>
        <circle cx="10" cy="11" r="3.6" fill="#7cc6f5"/>
        <rect x="6.4" y="17" width="7.2" height="12" rx="1.6" fill="#7cc6f5"/>
        <path d="M19 29v-7a4.4 4.4 0 0 1 8.8 0v7" fill="none" stroke="#7cc6f5" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="524" y="268" class="cn-sans" font-size="18" font-weight="600" fill="#eef2ff">LinkedIn</text>
      <text x="524" y="290" class="cn-mono" font-size="12.5" fill="#8b93b0">4 projects in progress</text>
      <g class="cn-nudge-3">
        <path d="M740 264h16m-6-6l6 6-6 6" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- card 4 : Projects -->
    <g class="cn-in c9">
      <rect x="800" y="234" width="360" height="72" rx="18" fill="#ffffff" fill-opacity="0.045" stroke="url(#cnHair)" stroke-opacity="0.28"/>
      <rect x="800" y="234" width="5" height="72" rx="2.5" fill="#f472b6"/>
      <g transform="translate(824,254)">
        <g transform="rotate(-14 17 17)">
          <rect x="0" y="0" width="34" height="34" rx="4" fill="none" stroke="#f9a8d4" stroke-width="1.8"/>
          <rect x="10" y="10" width="14" height="14" rx="2.4" fill="#f472b6" fill-opacity="0.5"/>
        </g>
      </g>
      <text x="874" y="268" class="cn-sans" font-size="18" font-weight="600" fill="#eef2ff">My Projects</text>
      <text x="874" y="290" class="cn-mono" font-size="12.5" fill="#8b93b0">neo browser · ai assistant · more</text>
      <g class="cn-nudge-1">
        <path d="M1120 264h16m-6-6l6 6-6 6" fill="none" stroke="#f472b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- footer strip -->
    <g class="cn-in c10">
      <rect x="450" y="326" width="710" height="58" rx="16" fill="url(#cnHair)" fill-opacity="0.07" stroke="url(#cnHair)" stroke-opacity="0.25"/>
      <circle cx="482" cy="355" r="5" fill="#4ade80">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="498" y="361" class="cn-mono" font-size="14" fill="#e6ebf8">Currently in Mumbai, India · reply time &lt; 24h</text>
      <text x="1140" y="361" text-anchor="end" class="cn-mono" font-size="13" fill="#8b93b0">work hard · work smart · work fast</text>
    </g>
  </g>
</svg>
