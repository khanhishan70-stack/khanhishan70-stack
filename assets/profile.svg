<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="acore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="184" height="184" rx="44" fill="#030818"/>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="none" stroke="rgba(0,229,255,0.45)" stroke-width="1.5"/>
  <rect x="12" y="12" width="176" height="176" rx="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <circle cx="100" cy="100" r="78" fill="url(#acore)"/>

  <g stroke="#00E5FF" stroke-width="1.1" opacity="0.55">
    <line x1="100" y1="24" x2="100" y2="50"/>
    <line x1="100" y1="150" x2="100" y2="176"/>
    <line x1="24" y1="100" x2="50" y2="100"/>
    <line x1="150" y1="100" x2="176" y2="100"/>
    <line x1="46" y1="46" x2="64" y2="64"/>
    <line x1="136" y1="136" x2="154" y2="154"/>
    <line x1="46" y1="154" x2="64" y2="136"/>
    <line x1="136" y1="64" x2="154" y2="46"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="100" cy="24" r="3"/>
    <circle cx="100" cy="176" r="3"/>
    <circle cx="24" cy="100" r="3"/>
    <circle cx="176" cy="100" r="3"/>
    <circle cx="46" cy="46" r="3"/>
    <circle cx="154" cy="154" r="3"/>
    <circle cx="46" cy="154" r="3"/>
    <circle cx="154" cy="46" r="3"/>
  </g>

  <polygon points="100,50 143,75 143,125 100,150 57,125 57,75" fill="rgba(0,229,255,0.06)" stroke="url(#ag)" stroke-width="1.5"/>
  <polygon points="100,50 143,75 143,125 100,150 57,125 57,75" fill="none" stroke="rgba(0,229,255,0.10)" stroke-width="6"/>

  <circle cx="100" cy="100" r="17" fill="#00E5FF" opacity="0.15"/>
  <circle cx="100" cy="100" r="9" fill="#00E5FF">
    <animate attributeName="opacity" values="0.95;0.35;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="9" fill="none" stroke="#00E5FF" stroke-width="1">
    <animate attributeName="r" values="9;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
