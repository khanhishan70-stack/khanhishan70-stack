<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="360 48 48" dur="16s" repeatCount="indefinite"/>
    <rect x="30" y="30" width="36" height="36" rx="9" fill="none" stroke="url(#lg)" stroke-width="1.5" stroke-dasharray="20 8" opacity="0.85"/>
  </g>

  <polygon points="48,14 76,31 76,65 48,82 20,65 20,31" fill="rgba(0,229,255,0.045)" stroke="rgba(0,229,255,0.4)" stroke-width="1.2"/>

  <g>
    <circle cx="48" cy="48" r="11" fill="rgba(0,229,255,0.10)" stroke="#00E5FF" stroke-width="1.2">
      <animate attributeName="r" values="11;13;11" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="48" r="4.5" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="-360 48 48" dur="7s" repeatCount="indefinite"/>
    <circle cx="48" cy="24" r="3" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
