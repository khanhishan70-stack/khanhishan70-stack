<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="About Hishan Khan">
  <title>About Hishan Khan</title>
  <defs>
    <linearGradient id="alSurf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141f"/>
      <stop offset="1" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="alHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="alInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#b9c2e0"/>
    </linearGradient>
    <linearGradient id="alGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="alAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="alDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="alClip"><rect x="0" y="0" width="1200" height="460" rx="26"/></clipPath>
    <clipPath id="alNameMask">
      <rect id="alMaskRect" x="64" y="118" width="0" height="92">
        <animate attributeName="width" begin="0s" dur="1.05s" fill="freeze"
                 values="0;0;330;330;600;600;820;820" keyTimes="0;0.10;0.20;0.34;0.44;0.58;0.68;1"/>
      </rect>
    </clipPath>
    <filter id="alSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .al-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .al-sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .al-up   { animation: alUp .8s cubic-bezier(.22,1,.36,1) both; }
    .al-d1 { animation-delay: .10s } .al-d2 { animation-delay: .22s }
    .al-d3 { animation-delay: .34s } .al-d4 { animation-delay: .46s }
    .al-d5 { animation-delay: .58s } .al-d6 { animation-delay: .70s }
    .al-d7 { animation-delay: .82s } .al-d8 { animation-delay: .94s }
    .al-d9 { animation-delay: 1.06s } .al-d10 { animation-delay: 1.18s }
    @keyframes alUp { from { opacity:0; transform: translateY(18px) } to { opacity:1; transform: none } }
    .al-typed {
      animation: alType 2.4s steps(12, end) 0.55s both;
      white-space: pre;
    }
    @keyframes alType { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    .al-caret { animation: alBlink 1.05s steps(1, end) 3.1s infinite; }
    @keyframes alBlink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    .al-shine { animation: alShine 5.5s linear infinite; }
    @keyframes alShine { from { transform: translateX(-380px) } to { transform: translateX(1320px) } }
    .al-dot { animation: alPulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes alPulse { 0%,100% { opacity:.35; transform: scale(.85) } 50% { opacity:1; transform: scale(1) } }
    .al-bar { animation: alBar 1s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes alBar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>

  <g clip-path="url(#alClip)">
    <rect width="1200" height="460" fill="url(#alSurf)"/>
    <rect width="1200" height="460" fill="url(#alDots)"/>
    <ellipse cx="880" cy="90" rx="420" ry="240" fill="url(#alAura)"/>
    <ellipse cx="200" cy="430" rx="340" ry="200" fill="url(#alAura)" opacity="0.5"/>
    <g class="al-shine" opacity="0.55">
      <rect x="120" y="-140" width="150" height="740" fill="#ffffff" opacity="0.05" transform="rotate(18 195 270)"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="459" rx="26" fill="none" stroke="url(#alHair)" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- eyebrow pill -->
    <g class="al-up al-d1">
      <rect x="64" y="52" width="286" height="40" rx="20" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
      <circle class="al-dot" cx="90" cy="72" r="5" fill="#22d3ee"/>
      <text x="110" y="78" class="al-mono" font-size="15" fill="#a5f3fc" letter-spacing="0.5">HISHAN KHAN</text>
    </g>

    <!-- typed greeting -->
    <text x="64" y="140" class="al-mono" font-size="26" fill="#8b93b0"><tspan class="al-typed">&gt; Hi there, I&#39;m </tspan><tspan class="al-caret" fill="#22d3ee">|</tspan></text>

    <!-- name with rising mask -->
    <g clip-path="url(#alNameMask)">
      <text x="64" y="212" class="al-sans" font-size="88" font-weight="800" fill="url(#alInk)" letter-spacing="-2">Hishan Khan</text>
      <text x="64" y="212" class="al-sans" font-size="88" font-weight="800" fill="url(#alGlow)" opacity="0.30" letter-spacing="-2">Hishan Khan</text>
    </g>

    <!-- pitch -->
    <text x="64" y="266" class="al-sans al-up al-d4" font-size="24" fill="#c3cbe4">IT Diploma Student building modern web experiences and AI-powered software.</text>
    <rect x="64" y="286" width="86" height="4" rx="2" fill="url(#alGlow)" class="al-bar al-d5"/>

    <!-- role cycling -->
    <g class="al-up al-d6">
      <rect x="64" y="312" width="352" height="46" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="88" y="342" class="al-mono" font-size="18" fill="#e2e8ff">Developer · Python / JS
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.16;0.20;0.36;0.40;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="342" class="al-mono" font-size="18" fill="#e2e8ff">AI / ML Explorer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.20;0.36;0.40;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="342" class="al-mono" font-size="18" fill="#e2e8ff">Fast &amp; Smart Learner
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.40;0.56;0.60;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="342" class="al-mono" font-size="18" fill="#e2e8ff">UI / CSS Craftsman
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.60;0.76;0.80;1" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="88" y="342" class="al-mono" font-size="18" fill="#e2e8ff">Full-Stack in progress
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.80;0.96;1;1" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- meta row -->
    <g class="al-up al-d7">
      <g transform="translate(64,384)">
        <path d="M8 0c-4.4 0-8 3.6-8 8 0 5.6 8 13 8 13s8-7.4 8-13c0-4.4-3.6-8-8-8z" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
        <circle cx="8" cy="8" r="2.8" fill="#22d3ee"/>
        <text x="26" y="13" class="al-mono" font-size="17" fill="#cbd5e1">Mumbai, IN</text>
      </g>
      <g transform="translate(250,384)">
        <rect x="0" y="1" width="17" height="14" rx="2.5" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
        <path d="M0 6h17" stroke="#a78bfa" stroke-width="1.8"/>
        <path d="M4 11h6" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
        <text x="26" y="13" class="al-mono" font-size="17" fill="#cbd5e1">Open to Work</text>
      </g>
      <g transform="translate(454,384)">
        <path d="M8.5 0.6l2.3 4.8 5.2.7-3.8 3.7.9 5.3-4.6-2.5-4.6 2.5.9-5.3L1 6.1l5.2-.7z" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="28" y="13" class="al-mono" font-size="17" fill="#cbd5e1">@khanhishan70-stack</text>
      </g>
      <g transform="translate(756,384)">
        <path d="M0 3.5h4.2v4.2H0zM5.8 3.5H10v4.2H5.8zM0 9.3h4.2v4.2H0zM5.8 9.3H10v4.2H5.8z" fill="#22d3ee" opacity="0.85"/>
        <text x="20" y="13" class="al-mono" font-size="17" fill="#cbd5e1">work hard · work smart · work fast</text>
      </g>
    </g>

    <!-- corner accent -->
    <path d="M1136 26h32a16 16 0 0 1 16 16v34" fill="none" stroke="url(#alGlow)" stroke-width="3" stroke-linecap="round" opacity="0.8" class="al-up al-d9"/>
  </g>
</svg>
